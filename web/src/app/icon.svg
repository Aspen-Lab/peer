<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Peer's mark: a sheet, registered. The corner tick is the product's own
       — the graph puts it on the node you point at, a card grows it under the
       pointer, the masthead registers the section you are in — and it takes
       the accent, the one mark in this product allowed to carry the hue.
       Nothing here is an illustration: it is the geometry the interface is
       drawn with, at the size a tab shows it. -->
  <rect width="64" height="64" fill="#111111" />
  <rect x="12" y="12" width="40" height="40" fill="#ededed" />
  <g fill="#ff520d">
    <path d="M34 12h18v6H34z" />
    <path d="M46 12h6v18h-6z" />
  </g>
</svg>
